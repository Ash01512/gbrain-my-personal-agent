name = "property-outreach-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Deployed on its own, with `npm run deploy` from this directory.
#
# The repository-root wrangler.toml belongs to job-tracker-worker and drives
# Cloudflare's Git integration for that Worker only. This one is deliberately
# NOT wired into that, so a push cannot redeploy the outreach Worker by
# accident — the thing that sends WhatsApp messages should go out when a human
# runs the command, not when a commit lands.
#
# No secrets here. wrangler.toml is committed, so these are set with
# `wrangler secret put` (production) or .dev.vars (local):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   API_TOKEN
#   LETSBOT_API_KEY
#
# See README "Before the first real send" for LETSBOT_API_BASE and the
# send-path fields, which are not secrets and live in [vars] below.

[vars]
APP_TIMEZONE = "Asia/Dubai"

# LetsBot's own docs are at docs.letsbot.net. Confirm the base and path there
# before flipping OUTREACH_LIVE on — see src/letsbot.ts for what is confirmed
# and what is inferred.
LETSBOT_API_BASE = "https://api.letsbot.net"
LETSBOT_SEND_PATH = "/v1/messages"

# The master switch. "false" makes every send a dry run that returns the exact
# outbound payload without calling LetsBot. It ships false on purpose: a
# misconfigured send path costs real messages against a real number, and a
# number that sends one bad campaign does not get a second chance.
OUTREACH_LIVE = "false"

# The second switch, independent of the first. "true" lets the cron handler
# draft and send with no human involved. Two switches rather than one because
# autopilot-in-dry-run is the rehearsal worth having: the schedule fires, the
# campaign selects real contacts, the payloads are built and logged, and
# nothing is transmitted. Turn this on first, read a few runs, then set
# OUTREACH_LIVE.
OUTREACH_AUTOPILOT = "false"

# How many messages one contact may receive in the rolling window below.
# Note that the once-per-contact rule is stricter than either and is not
# configurable — see limitsFrom() in src/index.ts.
OUTREACH_MAX_PER_CONTACT = "2"
OUTREACH_WINDOW_DAYS = "30"

# Shown on the public opt-in page at /optin.
BUSINESS_NAME = "our team"

# Your business WhatsApp number, E.164. Powers the "Message us on WhatsApp"
# button on /optin, which is the PREFERRED way onto the list: a message from
# the person's own handset proves the number is theirs, where a number typed
# into a form is only self-asserted. Leave empty and the page falls back to the
# form alone.
WHATSAPP_NUMBER = ""

# Hourly. Each tick advances every active campaign by one batch_size, so the
# pace is set per campaign rather than here — a shorter cron would not send
# more, it would just reach the daily cap earlier in the day.
#
# Meta rates a number partly on how it ramps. A new number that sends its whole
# list on day one is the classic way to get restricted, which is why the
# default batch_size is 5 and daily_cap is 20.
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
