# Deploy config for Cloudflare's Git integration, and only for that.
#
# It exists at the repository root so the dashboard's DEFAULTS work: no root
# directory, no build command, no deploy command. The root-directory field is
# absent from some dashboard versions, and setting it wrong produces a green
# build that serves nothing — so the config comes to Cloudflare instead.
#
# job-tracker-worker/wrangler.toml is the one `npm run dev` and `npm run
# deploy` use. test/wrangler-sync.test.ts fails the build if the two disagree
# on the name, the compatibility date, or the timezone.
#
# No secrets here. SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and API_TOKEN are
# set once on the Worker itself.

name = "job-tracker-worker"
main = "job-tracker-worker/src/index.ts"
compatibility_date = "2026-08-01"

# Do not delete dashboard-set variables on deploy. Without this, wrangler
# clears every var not listed below on each deploy — so three secrets added
# through the dashboard as plain variables vanish on the next push, and
# /api/health reports all three false with nothing explaining why. Secrets are
# never deleted either way; this covers the case where they were added as
# plain variables by mistake.
keep_vars = true

[vars]
APP_TIMEZONE = "Asia/Dubai"

[observability]
enabled = true
